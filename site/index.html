<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Python Interactive Tutorial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/styles/theme.css">
  <link rel="stylesheet" href="assets/styles/mobile.css">
  <!-- LiaScript is loaded for M2's renderer work. It does NOT drive lesson
       display yet: the lesson body below is assigned as plain text, so Phase 1
       ships readable Markdown, not LiaScript rendering. The previous URL
       (liascript-template@master/dist/liascript.min.js) pointed at a
       non-existent repository and 404'd; this is LiaScript's own published
       entry point, which publishes no version-pinned build to pin to. -->
  <script src="https://liascript.github.io/course/preview-lia.js" defer></script>
  <script src="assets/runtime/lesson-loader.js" defer></script>
  <script src="assets/runtime/check-runner.js" defer></script>
  <script src="assets/runtime/run-code.js" defer></script>
  <script src="assets/runtime/ui-controls.js" defer></script>
</head>
<body>
  <header style="padding:1rem; border-bottom:1px solid #e5e7eb;">
    <h1 style="margin:0; font-size:1.2rem;">Python Interactive Tutorial</h1>
  </header>
  <main>
    <p id="loading" style="color:#6b7280;">Loading lesson…</p>
    <article id="lia-container"></article>
    <h2>Try it</h2>
    <div id="editor-host" class="editor-wrap"></div>
    <section id="lesson-controls" class="lesson-controls"></section>
  </main>
  <script type="module">
    import { createEditor } from 'assets/runtime/code-editor.bundle.js'

    const params = new URLSearchParams(location.search)
    const id = params.get('id') || 'ch01-l01-hello'
    const loading = document.getElementById('loading')

    try {
      // Metadata comes from the manifest, already parsed by build-manifest.
      const lesson = await window.LiaScriptLoader.getLesson(id)
      // parseFrontmatter is only used to split the Markdown body from its frontmatter.
      const md = await window.LiaScriptLoader.fetchLesson(id)
      const { body } = window.CheckRunner.parseFrontmatter(md)
      loading.remove()
      // textContent, not innerText: the lesson is Markdown source, and innerText
      // collapses its run of whitespace into one paragraph.
      document.getElementById('lia-container').textContent = body

      const view = createEditor(document.getElementById('editor-host'), lesson.starter_code || '')

      const title = lesson.title && (lesson.title.en || lesson.title.zh)
      if (title) {
        const h = document.querySelector('header h1')
        if (h) h.textContent = title
      }

      window.UIControls.bind({
        lesson: lesson,
        getCode: () => view.state.doc.toString(),
        onPass: () => window.Progress && window.Progress.markDone(id),
      })
    } catch (err) {
      // A 404, a transient failure or an unknown ?id= used to leave "Loading
      // lesson…" forever, with no Run button and no explanation.
      const message = 'Failed to load lesson: ' + ((err && err.message) || String(err))
      loading.textContent = message
      if (!loading.isConnected) {
        document.getElementById('lia-container').textContent = message
      }
    }
  </script>
  <div class="progress-controls" style="padding:0.5rem;">
    <button type="button" id="btn-export">Export Progress</button>
    <input type="file" id="file-import" accept="application/json" hidden>
    <button type="button" id="btn-import">Import Progress</button>
    <p id="import-status" role="status" style="margin:0.5rem 0 0; color:#6b7280;"></p>
  </div>
  <script src="assets/runtime/progress.js" defer></script>
  <script>
    const importStatus = document.getElementById('import-status')
    document.getElementById('btn-export').onclick = () => window.Progress && window.Progress.exportJSON()
    document.getElementById('btn-import').onclick = () => document.getElementById('file-import').click()
    document.getElementById('file-import').onchange = async (e) => {
      const input = e.target
      const f = input.files[0]
      if (!f) return
      try {
        await window.Progress.importJSON(f)
        importStatus.textContent = 'Progress imported.'
      } catch (err) {
        importStatus.textContent = 'Import failed: ' + err.message
      } finally {
        // Clear so picking the same file again still fires `change`.
        input.value = ''
      }
    }
  </script>
</body>
</html>
